<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ Звёздный ловец ✨</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at 30% 10%, #0b0f2a, #030514);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', system-ui, sans-serif;
            padding: 10px;
        }

        .game-container {
            background: #0a0e1e;
            padding: 18px 18px 22px;
            border-radius: 42px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), 0 0 0 2px #3f4b7a inset, 0 0 30px #4f6eff66;
            position: relative;
            max-width: 100%;
        }

        canvas {
            display: block;
            width: 480px;
            height: 480px;
            max-width: 100%;
            border-radius: 30px;
            background: #060a17;
            box-shadow: 0 0 0 3px #1e2642, 0 18px 30px -8px black;
            cursor: none;
            transition: filter 0.2s;
            touch-action: none;
        }

        .panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 16px;
            padding: 0 6px;
            color: #cfd9ff;
            text-shadow: 0 0 8px #4f6eff;
            font-weight: 600;
            letter-spacing: 1px;
            gap: 10px;
            flex-wrap: wrap;
        }

        .stats {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .score, .lives {
            background: #11182e;
            padding: 8px 18px;
            border-radius: 60px;
            border: 1px solid #39508b;
            box-shadow: 0 0 15px #1d3d9e, inset 0 0 6px #2b3f7c;
            font-size: 1.25rem;
            color: #eef3ff;
            white-space: nowrap;
        }

        .lives .heart {
            color: #ff5a7a;
            filter: drop-shadow(0 0 6px #ff2a55);
            margin-left: 4px;
        }

        .difficulty-select {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .diff-btn {
            background: #151d36;
            border: 1px solid #3a4c80;
            border-radius: 60px;
            padding: 6px 14px;
            font-size: 0.85rem;
            font-weight: 700;
            color: #a8b8e8;
            cursor: pointer;
            transition: all 0.15s ease;
            letter-spacing: 0.5px;
        }

        .diff-btn:hover {
            background: #1f2b4d;
            color: #dbe6ff;
        }

        .diff-btn.active {
            background: #3d5bd0;
            border-color: #8ea8ff;
            color: #ffffff;
            box-shadow: 0 0 15px #4f7eff, inset 0 0 8px #1e3a9a;
        }

        .restart-btn {
            background: #1d2849;
            border: none;
            border-radius: 60px;
            padding: 10px 22px;
            font-size: 1rem;
            font-weight: bold;
            color: #c6d4ff;
            cursor: pointer;
            border: 1px solid #5470c0;
            box-shadow: 0 0 18px #3355dd77, 0 5px 0 #0a0f1f;
            transition: all 0.1s ease;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .restart-btn:hover {
            background: #273763;
            border-color: #7b97ff;
            color: white;
            box-shadow: 0 0 28px #4f7eff, 0 5px 0 #0a0f1f;
        }

        .restart-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 28px #4f7eff, 0 1px 0 #0a0f1f;
        }

        .game-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #000000d8;
            backdrop-filter: blur(6px);
            color: #f0f4ff;
            font-size: 1.8rem;
            font-weight: 800;
            padding: 26px 44px;
            border-radius: 70px;
            border: 2px solid #5f7eff;
            box-shadow: 0 0 50px #4f6eff, inset 0 0 20px #2a3f9e;
            text-align: center;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.25s;
            letter-spacing: 2px;
            white-space: nowrap;
            text-shadow: 0 0 15px cyan;
        }

        @media (max-width: 540px) {
            canvas { width: 340px; height: 340px; }
            .game-overlay { font-size: 1.3rem; padding: 18px 26px; }
            .score, .lives { font-size: 1rem; padding: 6px 12px; }
            .diff-btn { padding: 5px 10px; font-size: 0.75rem; }
        }
    </style>
</head>
<body>
<div class="game-container">
    <canvas id="gameCanvas" width="480" height="480"></canvas>
    <div class="panel">
        <div class="stats">
            <div class="score">✨ <span id="scoreDisplay">0</span></div>
            <div class="lives" id="livesDisplay">❤️❤️❤️</div>
        </div>
        <div class="difficulty-select" id="difficultySelect">
            <button class="diff-btn active" data-diff="easy">Лёгкий</button>
            <button class="diff-btn" data-diff="medium">Средний</button>
            <button class="diff-btn" data-diff="hard">Сложный</button>
            <button class="diff-btn" data-diff="impossible">Невозможный</button>
        </div>
        <button class="restart-btn" id="restartButton">↻ Заново</button>
    </div>
    <div id="gameOverlay" class="game-overlay">💥 ИГРА ОКОНЧЕНА</div>
</div>

<script>
    (function() {
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreSpan = document.getElementById('scoreDisplay');
        const livesDisplay = document.getElementById('livesDisplay');
        const overlay = document.getElementById('gameOverlay');
        const restartBtn = document.getElementById('restartButton');
        const diffButtons = document.querySelectorAll('.diff-btn');

        // Константы
        const CW = 480, CH = 480;
        const PLAYER_RADIUS = 18;
        const STAR_RADIUS = 12;
        const PLANET_RADIUS = 14;

        // Настройки сложности
        const DIFFICULTY = {
            easy:       { name: 'Лёгкий',       spawnInterval: 45, minInterval: 22, planetChance: 0.15, starSpeedMin: 1.2, starSpeedMax: 2.0, planetSpeedMin: 1.2, planetSpeedMax: 2.0, maxLives: 5, speedGrowth: 0.010 },
            medium:     { name: 'Средний',      spawnInterval: 36, minInterval: 16, planetChance: 0.25, starSpeedMin: 1.6, starSpeedMax: 2.6, planetSpeedMin: 1.6, planetSpeedMax: 2.6, maxLives: 3, speedGrowth: 0.018 },
            hard:       { name: 'Сложный',      spawnInterval: 28, minInterval: 12, planetChance: 0.35, starSpeedMin: 2.0, starSpeedMax: 3.2, planetSpeedMin: 2.0, planetSpeedMax: 3.2, maxLives: 2, speedGrowth: 0.028 },
            impossible: { name: 'Невозможный',  spawnInterval: 18, minInterval: 7,  planetChance: 0.48, starSpeedMin: 2.6, starSpeedMax: 4.2, planetSpeedMin: 2.6, planetSpeedMax: 4.2, maxLives: 1, speedGrowth: 0.045 }
        };

        let currentDiff = 'easy';
        let settings = DIFFICULTY[currentDiff];

        // Состояние
        let gameActive = true;
        let score = 0;
        let lives = 3;
        let frame = 0;
        let shakeTimer = 0; // для тряски при потере жизни

        // Игрок
        const player = { x: CW/2, y: CH - 60, r: PLAYER_RADIUS, targetX: CW/2, targetY: CH - 60 };

        // Объекты
        let stars = [];      // { x, y, r, speed, angle, rotSpeed }
        let planets = [];
        let particles = [];  // частицы для анимации сбора
        let floatingTexts = []; // всплывающий текст "+1"

        // ---- Утилиты ----
        const rand = (min, max) => Math.random() * (max - min) + min;

        function updateLivesDisplay() {
            let hearts = '';
            for (let i = 0; i < settings.maxLives; i++) {
                hearts += i < lives ? '<span class="heart">❤️</span>' : '<span style="opacity:0.25">❤️</span>';
            }
            livesDisplay.innerHTML = hearts;
        }

        function updateScoreDisplay() {
            scoreSpan.textContent = score;
        }

        // Рисование пятиконечной звезды
        function drawStarShape(ctx, cx, cy, spikes, outerR, innerR, rotation) {
            let rot = rotation || 0;
            let step = Math.PI / spikes;
            ctx.beginPath();
            for (let i = 0; i < spikes * 2; i++) {
                const r = (i % 2 === 0) ? outerR : innerR;
                const angle = i * step - Math.PI / 2 + rot;
                const x = cx + Math.cos(angle) * r;
                const y = cy + Math.sin(angle) * r;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.closePath();
        }

        // Сброс
        function resetGame() {
            gameActive = true;
            score = 0;
            lives = settings.maxLives;
            frame = 0;
            shakeTimer = 0;
            stars = [];
            planets = [];
            particles = [];
            floatingTexts = [];
            player.x = CW/2;
            player.y = CH - 60;
            player.targetX = player.x;
            player.targetY = player.y;
            overlay.style.opacity = '0';
            updateScoreDisplay();
            updateLivesDisplay();
        }

        function gameOver() {
            if (!gameActive) return;
            gameActive = false;
            overlay.textContent = '💥 ИГРА ОКОНЧЕНА';
            overlay.style.opacity = '1';
        }

        function winGame() {
            if (!gameActive) return;
            gameActive = false;
            overlay.textContent = '🏆 ПОБЕДА!';
            overlay.style.opacity = '1';
        }

        // Потеря жизни
        function loseLife() {
            lives--;
            updateLivesDisplay();
            shakeTimer = 18; // тряска 18 кадров
            // Взрыв частиц у игрока
            spawnExplosionParticles(player.x, player.y, '#ff5566', 25);
            if (lives <= 0) {
                gameOver();
            }
        }

        // ---- Спавн ----
        function spawnObject() {
            const diffFactor = Math.min(score / 20, 6);
            const spawnInterval = Math.max(settings.minInterval, settings.spawnInterval - Math.floor(diffFactor * 3));

            if (frame % spawnInterval !== 0) return;

            const isPlanet = Math.random() < settings.planetChance;

            // X всегда внутри поля
            const x = rand(STAR_RADIUS + 20, CW - STAR_RADIUS - 20);
            const y = -rand(20, 50);

            const speedBonus = Math.min(score * settings.speedGrowth, 2.2);

            if (isPlanet) {
                planets.push({
                    x, y, r: PLANET_RADIUS,
                    speed: rand(settings.planetSpeedMin, settings.planetSpeedMax) + speedBonus,
                    angle: rand(0, Math.PI * 2),
                    rotSpeed: rand(-0.03, 0.03)
                });
            } else {
                stars.push({
                    x, y, r: STAR_RADIUS,
                    speed: rand(settings.starSpeedMin, settings.starSpeedMax) + speedBonus,
                    angle: rand(0, Math.PI * 2),
                    rotSpeed: rand(-0.05, 0.05),
                    // лёгкое покачивание по X
                    wobbleAmp: rand(0, 1.2),
                    wobbleSpeed: rand(0.02, 0.06),
                    baseX: x
                });
            }
        }

        // ---- Частицы ----
        function spawnExplosionParticles(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                const angle = rand(0, Math.PI * 2);
                const speed = rand(1, 4.5);
                particles.push({
                    x, y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 1,
                    decay: rand(0.02, 0.05),
                    color: color,
                    size: rand(2, 4)
                });
            }
        }

        // ---- Обновление ----
        function update() {
            if (shakeTimer > 0) shakeTimer--;

            // Обновляем частицы всегда (чтобы доигрывали)
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.08;
                p.vx *= 0.98;
                p.life -= p.decay;
                if (p.life <= 0) particles.splice(i, 1);
            }

            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                const t = floatingTexts[i];
                t.y -= 1.3;
                t.life -= 0.022;
                if (t.life <= 0) floatingTexts.splice(i, 1);
            }

            if (!gameActive) return;

            frame++;

            // Движение игрока
            player.x += (player.targetX - player.x) * 0.18;
            player.y += (player.targetY - player.y) * 0.18;
            player.x = Math.max(player.r + 2, Math.min(CW - player.r - 2, player.x));
            player.y = Math.max(player.r + 2, Math.min(CH - player.r - 2, player.y));

            spawnObject();

            // Звёзды
            for (let i = stars.length - 1; i >= 0; i--) {
                const s = stars[i];
                s.y += s.speed;
                s.angle += s.rotSpeed;
                // покачивание по X
                s.wobblePhase = (s.wobblePhase || 0) + s.wobbleSpeed;
                s.x = s.baseX + Math.sin(s.wobblePhase) * s.wobbleAmp;

                // Не даём улетать за пределы по X
                if (s.x < s.r) { s.x = s.r; s.baseX = s.r; }
                if (s.x > CW - s.r) { s.x = CW - s.r; s.baseX = CW - s.r; }

                // Столкновение с игроком
                const dx = s.x - player.x, dy = s.y - player.y;
                const dist = Math.hypot(dx, dy);
                if (dist < s.r + player.r) {
                    score++;
                    updateScoreDisplay();
                    spawnExplosionParticles(s.x, s.y, '#fef47a', 20);
                    floatingTexts.push({ x: s.x, y: s.y, life: 1, text: '+1', color: '#fef47a' });
                    stars.splice(i, 1);
                    continue;
                }

                // Удаление, если улетела вниз
                if (s.y - s.r > CH + 20) {
                    stars.splice(i, 1);
                }
            }

            // Планеты
            for (let i = planets.length - 1; i >= 0; i--) {
                const p = planets[i];
                p.y += p.speed;
                p.angle += p.rotSpeed;

                const dx = p.x - player.x, dy = p.y - player.y;
                const dist = Math.hypot(dx, dy);
                if (dist < p.r + player.r) {
                    planets.splice(i, 1);
                    loseLife();
                    if (lives <= 0) break;
                    continue;
                }

                if (p.y - p.r > CH + 20) {
                    planets.splice(i, 1);
                }
            }
        }

        // ---- Отрисовка ----
        function draw() {
            ctx.save();

            // Тряска
            if (shakeTimer > 0) {
                const intensity = shakeTimer / 18 * 5;
                ctx.translate(rand(-intensity, intensity), rand(-intensity, intensity));
            }

            // Фон
            const bgGrad = ctx.createRadialGradient(240, 200, 50, 240, 240, 400);
            bgGrad.addColorStop(0, '#0c122b');
            bgGrad.addColorStop(0.8, '#030617');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(-10, -10, CW + 20, CH + 20);

            // Декоративные звёзды фона
            for (let i = 0; i < 80; i++) {
                const x = (i * 37 + (i % 7) * 13) % CW;
                const y = (i * 23 + (i % 5) * 17) % CH;
                const b = 0.15 + ((i * 7) % 10) / 40;
                ctx.fillStyle = `rgba(255,255,255,${b})`;
                ctx.beginPath();
                ctx.arc(x, y, 1 + (i % 2) * 0.6, 0, Math.PI * 2);
                ctx.fill();
            }

            // ---- Звёзды-объекты ----
            for (let s of stars) {
                // Свечение
                ctx.shadowColor = '#fef47a';
                ctx.shadowBlur = 22;

                // Тело звезды (5-конечная)
                drawStarShape(ctx, s.x, s.y, 5, s.r, s.r * 0.45, s.angle);
                ctx.fillStyle = '#fef47a';
                ctx.fill();

                // Внутренняя более яркая
                ctx.shadowBlur = 14;
                drawStarShape(ctx, s.x, s.y, 5, s.r * 0.7, s.r * 0.3, s.angle);
                ctx.fillStyle = '#fffbe0';
                ctx.fill();

                // Контур
                ctx.shadowBlur = 0;
                drawStarShape(ctx, s.x, s.y, 5, s.r, s.r * 0.45, s.angle);
                ctx.strokeStyle = '#ffec80';
                ctx.lineWidth = 1.2;
                ctx.stroke();
            }

            // ---- Планеты ----
            for (let p of planets) {
                ctx.shadowColor = '#ff3a3a';
                ctx.shadowBlur = 26;

                // Сфера
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fillStyle = '#c42f2f';
                ctx.fill();

                // Тёмная сторона
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.arc(p.x - 2, p.y - 2, p.r * 0.7, 0, Math.PI * 2);
                ctx.fillStyle = '#7a1414';
                ctx.fill();

                // Кольцо
                ctx.shadowBlur = 0;
                ctx.strokeStyle = '#ff9a9a';
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.ellipse(p.x, p.y, p.r * 1.7, p.r * 0.75, p.angle, 0, Math.PI * 2);
                ctx.stroke();

                // Блик
                ctx.beginPath();
                ctx.arc(p.x - 4, p.y - 4, p.r * 0.28, 0, Math.PI * 2);
                ctx.fillStyle = '#ffc9c9';
                ctx.fill();
            }

            // ---- Частицы ----
            for (let p of particles) {
                ctx.globalAlpha = Math.max(0, p.life);
                ctx.shadowColor = p.color;
                ctx.shadowBlur = 12;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
            ctx.shadowBlur = 0;

            // ---- Всплывающий текст ----
            for (let t of floatingTexts) {
                ctx.globalAlpha = Math.max(0, t.life);
                ctx.font = 'bold 22px "Segoe UI", sans-serif';
                ctx.fillStyle = t.color;
                ctx.textAlign = 'center';
                ctx.shadowColor = t.color;
                ctx.shadowBlur = 15;
                ctx.fillText(t.text, t.x, t.y);
            }
            ctx.globalAlpha = 1;
            ctx.shadowBlur = 0;

            // ---- Игрок ----
            ctx.shadowColor = '#4f9eff';
            ctx.shadowBlur = 30;

            // Корпус
            ctx.beginPath();
            ctx.moveTo(player.x, player.y - player.r * 1.2);
            ctx.lineTo(player.x - player.r * 1.1, player.y + player.r * 0.7);
            ctx.lineTo(player.x + player.r * 1.1, player.y + player.r * 0.7);
            ctx.closePath();
            ctx.fillStyle = '#7aaaff';
            ctx.fill();

            // Кабина
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.arc(player.x, player.y - 4, player.r * 0.45, 0, Math.PI * 2);
            ctx.fillStyle = '#d4e4ff';
            ctx.fill();

            // Двигатели
            ctx.shadowColor = '#ffbb33';
            ctx.shadowBlur = 22;
            ctx.beginPath();
            ctx.arc(player.x - player.r * 0.7, player.y + player.r * 0.8, 5, 0, Math.PI * 2);
            ctx.fillStyle = '#ffaa33';
            ctx.fill();
            ctx.beginPath();
            ctx.arc(player.x + player.r * 0.7, player.y + player.r * 0.8, 5, 0, Math.PI * 2);
            ctx.fillStyle = '#ffaa33';
            ctx.fill();

            ctx.restore();

            // Если не активна — затемнение (только если overlay уже показан)
            if (!gameActive) {
                ctx.fillStyle = 'rgba(0,0,0,0.35)';
                ctx.fillRect(0, 0, CW, CH);
            }
        }

        // ---- Игровой цикл ----
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // ---- Управление ----
        function handlePointerMove(e) {
            if (!gameActive) return;
            const rect = canvas.getBoundingClientRect();
            const scaleX = CW / rect.width;
            const scaleY = CH / rect.height;

            let cx, cy;
            if (e.touches) {
                if (e.touches.length === 0) return;
                cx = e.touches[0].clientX;
                cy = e.touches[0].clientY;
            } else {
                cx = e.clientX;
                cy = e.clientY;
            }

            let mx = (cx - rect.left) * scaleX;
            let my = (cy - rect.top) * scaleY;

            mx = Math.max(player.r, Math.min(CW - player.r, mx));
            my = Math.max(player.r, Math.min(CH - player.r, my));

            player.targetX = mx;
            player.targetY = my;
        }

        // ---- Смена сложности ----
        function setDifficulty(diff) {
            currentDiff = diff;
            settings = DIFFICULTY[diff];
            diffButtons.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.diff === diff);
            });
            resetGame();
        }

        // ---- Инициализация ----
        function init() {
            resetGame();

            canvas.addEventListener('mousemove', handlePointerMove);
            canvas.addEventListener('touchmove', (e) => {
                e.preventDefault();
                handlePointerMove(e);
            }, { passive: false });

            canvas.addEventListener('touchstart', (e) => {
                e.preventDefault();
                handlePointerMove(e);
            }, { passive: false });

            restartBtn.addEventListener('click', () => {
                if (lives <= 0 || !gameActive) {
                    resetGame();
                } else {
                    resetGame();
                }
            });

            diffButtons.forEach(btn => {
                btn.addEventListener('click', () => setDifficulty(btn.dataset.diff));
            });

            gameLoop();
        }

        init();
    })();
</script>
</body>
</html>
